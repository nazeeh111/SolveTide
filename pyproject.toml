[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solvetide"
version = "0.1.0"
description = "Residual-checked sparse simulation and implicit sensitivities across design edits"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Nazeeh Abdul-Hadi"}]
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "scikit-fem==12.0.2"]

[project.optional-dependencies]
study = ["pyamg==5.3.0", "matplotlib==3.11.2"]
dev = ["pytest==9.2.0", "build==1.6.1", "setuptools==84.2.1", "wheel==0.48.0"]

[project.scripts]
solvetide = "solvetide.cli:main"

[project.urls]
Repository = "https://github.com/nazeeh111/SolveTide"

[tool.setuptools.packages.find]
include = ["solvetide*"]

[tool.setuptools.package-data]
solvetide = ["web/*", "data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
